name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"

      - name: Build
        run: lake build

      - name: Paranoid audit
        run: python3 scripts/paranoid_audit.py

      - name: UI integrity
        run: python3 scripts/verify_ui_integrity.py

      - name: End-to-end
        run: python3 scripts/test_e2e.py

      - name: Fuzz and security
        run: python3 scripts/fuzz_stress_suite.py
